name: iptv_app
description: "IPTV Player"
publish_to: 'none'
version: 4.2.7+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  cached_network_image: ^3.4.1
  http: ^1.3.0
  window_manager: ^0.4.3
  shared_preferences: ^2.3.0
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  xml: ^6.5.0
  in_app_purchase: ^3.2.3
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.3
  package_info_plus: ^9.0.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


msix_config:
  display_name: IPTV Player
  publisher_display_name: IPTV App
  identity_name: com.iptvapp.player
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
